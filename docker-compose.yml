services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ml_course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ml_course"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@postgres:5432/ml_course"
      # You can also pass GigaChat vars here or via ./backend/.env
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Resource limits (target host: 4 vCPU / 8GB RAM total for the stack)
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G
    # Non-swarm compose limits (supported by many docker-compose installs)
    cpus: 3.0
    mem_limit: 6g

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    environment:
      # Used by Next.js rewrites to proxy /api -> backend
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    cpus: 1.0
    mem_limit: 2g

volumes:
  postgres_data:

